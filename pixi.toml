# Conda package definition for orbslam2 ([package], built by pixi-build from this repo for releases), plus a
# development environment ([workspace]) that compiles this repo in place with `pixi run install`.
# Releases are published by CI on vX.Y tags (linux-64, osx-arm64, win-64).
[workspace]
authors = ["vslamlab <vslamlab@gmail.com>"]
channels = ["https://prefix.dev/conda-forge"]
name = "orbslam2"
platforms = ["linux-64", "osx-arm64", "win-64"]
version = "0.1.0"
preview = ["pixi-build"]

########################################################################################################################
# Package. Release: from a clean checkout of a tagged commit (CI does this, see .github/workflows/conda-package.yml)
#   pixi publish --clean --target-dir output
#   pixi upload prefix --channel vslamlab/vslamlab output/*.conda
# Builds libORB_SLAM2 (DBoW2 and g2o linked in statically) and the vslamlab_orbslam2_{mono,rgbd,stereo} executables.
# ORBvoc.txt is not packaged: VSLAM-LAB downloads it (huggingface.co/vslamlab/orbslam2_vocabulary).
[package]
name = "orbslam2"
version = "1.0"
description = "ORB-SLAM2: real-time SLAM for monocular, stereo and RGB-D cameras"
authors = ["Raul Mur-Artal", "Juan D. Tardos", "J. M. M. Montiel", "Dorian Galvez-Lopez"]
license = "GPL-3.0-only"
license-file = "LICENSE.txt"
homepage = "https://github.com/raulmur/ORB_SLAM2"
repository = "https://github.com/VSLAM-LAB/orbslam2"

[package.build]
backend = { name = "pixi-build-cmake", version = "0.*" }

[package.host-dependencies]
libopencv = "<5"        # OpenCV 5 moved features2d out of the main modules
eigen = "*"
yaml-cpp = "*"
pangolin-opengl = "*"

[package.host-dependencies."if(host_platform == 'linux-64')"]
libgl-devel = "*"       # Pangolin's CMake config: find_package(OpenGL)
libopengl-devel = "*"

[package.run-dependencies]
pangolin-opengl = "*"

########################################################################################################################
# Workspace: development environment. `pixi run install` compiles this repo in place (bin/, lib/) for the local CPU
# (-march=native) against this environment and extracts the vocabulary; run it again after editing the sources.
# The environment gets the [package] build/host/run dependencies through [dev] (orbslam2 itself is not built).
[tasks]
extract-vocabulary = { cmd = "cmake -E tar xf ORBvoc.txt.tar.gz", cwd = "Vocabulary", inputs = ["Vocabulary/ORBvoc.txt.tar.gz"], outputs = ["Vocabulary/ORBvoc.txt"] }
install = { cmd = "cmake -G Ninja -B build -S . -DCMAKE_BUILD_TYPE=Release -DORBSLAM2_NATIVE=ON && cmake --build build", depends-on = ["extract-vocabulary"] }
execute-mono = "./bin/vslamlab_orbslam2_mono"
execute-rgbd = "./bin/vslamlab_orbslam2_rgbd"
execute-stereo = "./bin/vslamlab_orbslam2_stereo"
test = "./bin/vslamlab_orbslam2_mono --help && ./bin/vslamlab_orbslam2_rgbd --help && ./bin/vslamlab_orbslam2_stereo --help && echo OK"

[dev]
orbslam2 = { path = "." }  # installs the [package] build/host/run dependencies, not orbslam2 itself

[dependencies]
cmake = "*"
ninja = "*"
